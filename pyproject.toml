[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kv2026-zvoleni"
version = "0.1.0"
description = "Pravděpodobnost zvolení kandidáta v komunálních volbách 2026 z údajů známých před volbami"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn==1.9.1",
    "joblib>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kv2026_zvoleni = ["model.joblib"]
